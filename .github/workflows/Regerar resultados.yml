name: Regerar resultados 2022 (corrige campo eleito)

on:
  workflow_dispatch: {}

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Gerar resultados.json
        run: python gerar_resultados.py

      - name: Commitar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add resultados.json
          git diff --cached --quiet || git commit -m "Corrige campo eleito em resultados.json"
          git push
